[workspace]
resolver = "3"
members = [
    "crates/world",
    "crates/worldgen",
    "crates/navigation",
    "crates/simulation",
    "crates/rpg",
    "crates/protocol",
    "crates/content",
    "crates/server",
    "crates/client",
    "crates/editor",
    "crates/tools",
    "crates/trees",
    "crates/structures",
    "crates/collision",
]
# Vendored crates, patched (see third_party/README.md).
exclude = ["third_party/rerecast"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"

[workspace.dependencies]
venture_world = { path = "crates/world" }
venture_worldgen = { path = "crates/worldgen" }
venture_navigation = { path = "crates/navigation" }
venture_simulation = { path = "crates/simulation" }
venture_rpg = { path = "crates/rpg" }
venture_protocol = { path = "crates/protocol" }
venture_content = { path = "crates/content" }
venture_trees = { path = "crates/trees" }
venture_structures = { path = "crates/structures" }
venture_collision = { path = "crates/collision" }
venture_server = { path = "crates/server", default-features = false }
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", default-features = false, features = ["use-std"] }
ron = "0.12"
async-channel = "2"
sha2 = "0.11"
rhai = { version = "1.26", features = ["sync"] }
yarnspinner = "0.9"
noise = "0.9"
image = { version = "0.25", default-features = false, features = ["png"] }
bevy = { version = "0.19", default-features = false }
bevy_reflect = "0.19"
glam = "0.32"
serde_json = "1"

[patch.crates-io]
rerecast = { path = "third_party/rerecast" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Bevy is slow in unoptimised builds; optimise dependencies even in dev,
# while keeping our own code fast to compile.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# World generation is heavy number crunching: always optimise it, or chunk
# streaming stalls (especially on the web, where it runs on the main thread).
[profile.dev.package.venture_worldgen]
opt-level = 3

# So is growing trees (the client grows its tree templates as it loads).
[profile.dev.package.venture_trees]
opt-level = 3

# And building walls.
[profile.dev.package.venture_structures]
opt-level = 3

# Small, fast WebAssembly builds: `trunk build --release --cargo-profile wasm-release`.
[profile.wasm-release]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1
strip = "debuginfo"

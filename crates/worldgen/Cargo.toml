[package]
name = "venture_worldgen"
description = "Deterministic procedural world generation: terrain, rivers and lakes."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
venture_world.workspace = true
venture_structures.workspace = true
venture_collision.workspace = true
venture_navigation.workspace = true
glam.workspace = true
noise.workspace = true
# (A faster allocator for the bake: Recast allocates a lot, and the system's
# spends more time than the work itself.)
mimalloc = { version = "0.1", default-features = false }
# (For baking the world map's tiles: see `map_render`.)
image = { workspace = true, features = ["png", "jpeg"] }

[lints]
workspace = true

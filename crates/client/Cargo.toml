[package]
name = "venture_client"
description = "The Venture game client (Bevy): renders the world and handles input."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
venture_world.workspace = true
venture_navigation.workspace = true
venture_simulation.workspace = true
venture_protocol.workspace = true
venture_rpg.workspace = true
venture_content.workspace = true
bevy = { workspace = true, features = ["default"] }
ewebsock = "0.8"
ehttp = "0.7"

async-channel.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Desktop only: the game server, for `--local` mode.
venture_server = { workspace = true, default-features = false }

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = ["Window", "Location", "Storage", "Crypto"] }

[lints]
workspace = true
